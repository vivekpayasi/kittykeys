# XcodeGen spec. Run `xcodegen generate` to create Kittykeys.xcodeproj (gitignored).
name: Kittykeys

options:
  createIntermediateGroups: true

# Shared settings, including the optional, gitignored Config/Local.xcconfig.
# Signing and bundle-prefix settings live only in the xcconfig files, so that
# Local.xcconfig can override them.
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

settings:
  base:
    MARKETING_VERSION: 0.3.0
    CURRENT_PROJECT_VERSION: 3

packages:
  KittykeysCore:
    path: Packages/KittykeysCore

targets:
  Kittykeys:
    type: application
    platform: iOS
    sources:
      - App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(KITTYKEYS_BUNDLE_ID)
        INFOPLIST_FILE: App/Info.plist
        # From the xcconfig files, so Local.xcconfig can build without the App Group.
        CODE_SIGN_ENTITLEMENTS: $(KITTYKEYS_APP_ENTITLEMENTS)
        # iPhone only, as the design says.
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: KittykeysKeyboard
      - package: KittykeysCore
        product: KeyboardCore
      - package: KittykeysCore
        product: KeyboardUI
    scheme: {}

  KittykeysKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - Keyboard
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(KITTYKEYS_BUNDLE_ID).keyboard
        INFOPLIST_FILE: Keyboard/Info.plist
        CODE_SIGN_ENTITLEMENTS: $(KITTYKEYS_KB_ENTITLEMENTS)
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - package: KittykeysCore
        product: KeyboardCore
      - package: KittykeysCore
        product: KeyboardUI
